<!DOCTYPE html>
<html lang="en">
<head>

    <title>{% block title %}SQLi Prevention Framework{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

        Academic Cybersecurity Mini Project
