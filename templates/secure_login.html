{% extends "base.html" %}

{% block title %}Secure Login - SQLi Prevention Framework{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow-sm">
            <div class="card-body">

                <h2 class="card-title text-success">
                    Secure Login
                </h2>

                <p class="text-muted">
                    This page uses parameterized SQL queries to
                    prevent SQL Injection.
                </p>

                <div class="alert alert-success">
                    <strong>Protected:</strong>
                    User input is separated from the SQL statement.
                </div>

                <form method="POST">

                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-success">
                        Login
                    </button>

                    <a href="/" class="btn btn-secondary">
                        Back
                    </a>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
